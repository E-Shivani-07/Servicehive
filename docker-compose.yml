version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart-leads-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - leads-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-leads-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart-leads
      - JWT_SECRET=your_super_secret_jwt_key_here
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - leads-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-leads-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - leads-network

networks:
  leads-network:
    driver: bridge

volumes:
  mongodb_data:
